name: Release Core
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: starter
          POSTGRES_DB: starter
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:acceptance
        env:
          TEST_DATABASE_URL: postgresql://starter:starter@localhost:5432/starter
      - run: npm run build
      - run: npm run ops:verify
      - run: npm run release:pack -- --output .release
      - run: node scripts/release/publish.mjs .release
        env:
          GH_TOKEN: ${{ github.token }}
