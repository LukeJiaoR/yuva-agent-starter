name: CI Quality Gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify-and-test:
    name: Verification & Integration Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['24.22.1']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ziwei
          POSTGRES_PASSWORD: changeme_in_production
          POSTGRES_DB: ziwei
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Core Package Boundaries
        run: npm run verify:boundaries

      - name: Run Unit & Live PostgreSQL Contract Tests
        env:
          TEST_DATABASE_URL: postgresql://ziwei:changeme_in_production@localhost:5432/ziwei
          NODE_ENV: test
        run: npm run test:acceptance

      - name: Verify Operations Registry
        run: npm run ops:verify

      - name: Build Starter Web
        run: npm run build

      - name: Verify Independent Customer Support Consumer
        env:
          CI: 'true'
          TEST_DATABASE_URL: postgresql://ziwei:changeme_in_production@localhost:5432/ziwei
        run: |
          npm --prefix examples/customer-support ci
          npm --prefix examples/customer-support run check

      - name: Build Portable Containers
        if: matrix.node-version == '24.22.1'
        run: |
          docker build -f starter-app/Dockerfile -t starter-api:ci .
          docker build -f starter-web/Dockerfile -t starter-web:ci .
